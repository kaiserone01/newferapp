services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newfer-rentabilidad
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - visitas-data:/app/data
    restart: unless-stopped

volumes:
  visitas-data:
